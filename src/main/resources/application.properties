spring.application.name=spring-image

# DB (overridden by env in docker-compose)
spring.datasource.url=jdbc:mysql://mysql-image-container:3306/image_database
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka (used once image events / saga land in a later step)
spring.kafka.bootstrap-servers=kafka-container:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Keycloak JWT (shared realm with the other services)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak-container:8080/realms/clone/protocol/openid-connect/certs

# SPA web origin (CORS)
spa.web.origin=http://localhost:5173

# Server — gateway routes /api/image/* here; context-path keeps that prefix
server.port=8080
server.servlet.context-path=/api/image
