spring.application.name=spring-image

# DB (overridden by env in docker-compose)
spring.datasource.url=jdbc:mysql://mysql-image-container:3306/image_database
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka — consumes post.events.v1 to keep the post ↔ image association in sync
spring.kafka.bootstrap-servers=kafka-container:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=chimhaha-image
spring.kafka.consumer.auto-offset-reset=earliest

# Keycloak JWT (shared realm with the other services)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak-container:8080/realms/clone/protocol/openid-connect/certs

# S3 호환 스토리지 (SeaweedFS). spring 모놀리스와 같은 버킷 공유 — 이관 기간 동안 공존.
minio.url=http://seaweedfs-s3:8333
minio.access-key=admin
minio.secret-key=key
minio.bucket-name=minio-bucket
minio.thumbnail-bucket-name=minio-thumbnail
minio.export-url=http://192.168.1.2:9000

# SPA web origin (CORS)
spa.web.origin=http://localhost:5173

# Server — gateway routes /api/image/* here; context-path keeps that prefix
server.port=8080
server.servlet.context-path=/api/image
